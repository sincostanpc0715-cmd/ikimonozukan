<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いきもの図鑑</title>
<style>
  :root {
    --bg: #f6f4ee;
    --card: #ffffff;
    --text: #2b2a26;
    --muted: #7a776d;
    --accent: #3d7a4f;
    --accent-soft: #e3efe5;
    --new: #c4842a;
    --new-soft: #f8ecd8;
    --silhouette: #e4e1d8;
    --border: #e2ded2;
    --danger: #b4483c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  header .actions { display: flex; gap: 6px; }
  header button { background: transparent; border: 1px solid #fff8; color: #fff; padding: 6px 10px; font-size: .85rem; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  h3 { margin: 18px 0 8px; font-size: .95rem; display: flex; justify-content: space-between; }
  h3 .muted { font-weight: normal; }
  button {
    font: inherit;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.small { padding: 4px 10px; font-size: .85rem; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password], select {
    font: inherit;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 8px 0 4px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .center { text-align: center; }

  .shoot-btn {
    display: block;
    width: 100%;
    padding: 28px 16px;
    font-size: 1.1rem;
    text-align: center;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
  }
  .shoot-row { display: flex; gap: 8px; }
  .shoot-row .shoot-btn { flex: 1; padding: 22px 8px; font-size: 1rem; }
  #preview { width: 100%; max-height: 360px; object-fit: contain; border-radius: 8px; margin-top: 12px; background: #000; }

  .candidate {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    cursor: pointer;
  }
  .candidate.selected { border-color: var(--accent); background: var(--accent-soft); }
  .name { font-weight: bold; font-size: 1.05rem; }
  .sci { font-style: italic; color: var(--muted); font-size: .9rem; }
  .badge {
    display: inline-block;
    font-size: .75rem;
    padding: 1px 8px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-right: 4px;
  }
  .badge.new { background: var(--new-soft); color: var(--new); }
  .search-link {
    display: inline-block;
    font-size: .9rem;
    padding: 4px 12px;
    border: 1px solid var(--accent);
    border-radius: 99px;
    color: var(--accent);
    text-decoration: none;
    background: var(--card);
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tabs button { flex: 1; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .progress { height: 8px; background: var(--silhouette); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .progress div { height: 100%; background: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--card); }
  .card img, .card .shadow { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card .shadow {
    background: var(--silhouette);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; color: #fff; font-weight: bold;
  }
  .card .body { padding: 4px 6px; }
  .card .num { font-size: .7rem; color: var(--muted); }
  .card .title { font-weight: bold; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.unfound .title { color: var(--muted); }
  .card.new { border-color: var(--new); }

  dialog { border: none; border-radius: 12px; padding: 0; max-width: 560px; width: calc(100% - 32px); max-height: calc(100% - 32px); }
  dialog::backdrop { background: #0008; }
  dialog .hero { width: 100%; max-height: 45vh; object-fit: contain; background: #000; display: block; }
  dialog .body { padding: 16px; }
  .records { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .record { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  .record img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
  .record .info { flex: 1; font-size: .85rem; }
  .maint { background: var(--new-soft); border-radius: 10px; padding: 12px; margin-top: 12px; }
  .error { color: var(--danger); margin-top: 8px; white-space: pre-wrap; }
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid #fff8; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🌿 いきもの図鑑</h1>
  <div class="actions hidden" id="headerActions">
    <button id="settingsBtn">⚙ 設定</button>
    <button id="logoutBtn">ログアウト</button>
  </div>
</header>

<main>
  <!-- ログイン -->
  <section id="loginView" class="hidden center">
    <h2>家族の図鑑にログイン</h2>
    <p class="muted">家族として登録された Google アカウントでログインしてください。</p>
    <button class="primary" id="loginBtn">Google でログイン</button>
    <div id="loginError" class="error"></div>
  </section>

  <!-- 読み込み中 -->
  <section id="loadingView" class="center">
    <p class="muted">読み込んでいます…</p>
  </section>

  <div id="appView" class="hidden">
    <!-- 設定（APIキー） -->
    <section id="settings" class="hidden">
      <h2>設定</h2>
      <p class="muted">
        画像認識には Google の Gemini API（無料枠あり）を使います。<br>
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で取得した API キーを貼り付けてください。キーは家族の図鑑に保存され、家族はログインするだけで使えるようになります。
      </p>
      <label for="apiKey">API キー</label>
      <input type="password" id="apiKey" placeholder="AIza...">
      <label for="model">モデル名（ふつうは変えなくて大丈夫です）</label>
      <input type="text" id="model">
      <div class="row">
        <button class="primary" id="saveSettings">保存</button>
      </div>
    </section>

    <!-- 撮影 -->
    <section>
      <h2>📷 見つけたいきものを調べる</h2>
      <div class="shoot-row">
        <label class="shoot-btn" for="camera">📷 写真を撮る</label>
        <label class="shoot-btn" for="album">🖼 アルバムから選ぶ</label>
      </div>
      <!-- capture があるとスマホではカメラが直接起動するので、アルバム用は capture なし -->
      <input type="file" id="camera" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="album" accept="image/*" class="hidden">
      <img id="preview" class="hidden" alt="">
      <div class="row">
        <button class="primary hidden" id="identifyBtn">この写真を調べる</button>
      </div>
      <div id="error" class="error"></div>
    </section>

    <!-- 判定結果 -->
    <section id="result" class="hidden">
      <h2>🔍 候補</h2>
      <p class="muted">いちばん近いものを選んで登録してください。</p>
      <div id="candidates"></div>
      <label for="finder">見つけた人</label>
      <input type="text" id="finder" placeholder="なまえ">
      <label for="nickname">おなまえ（この子の名前。なくてもOK）</label>
      <input type="text" id="nickname" placeholder="例：ポチ">
      <div class="row">
        <button class="primary" id="registerBtn" disabled>登録する</button>
      </div>
      <div id="registerError" class="error"></div>
    </section>

    <!-- 図鑑 -->
    <section>
      <h2>📖 関東いきもの図鑑</h2>
      <div class="tabs">
        <button data-kind="虫">🐛 虫</button>
        <button data-kind="花">🌸 花</button>
        <button data-kind="犬">🐶 犬</button>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div id="progressText" class="muted"></div>
      <div id="zukan"></div>
    </section>

    <!-- 新発見 -->
    <section>
      <h2>✨ 新発見 <span id="newCount" class="muted"></span></h2>
      <p class="muted">図鑑のリストにない生き物はここに入ります。なかまを決めると図鑑に追加できます。</p>
      <div id="newList" class="grid"></div>
    </section>
  </div>
</main>

<!-- 詳細 -->
<dialog id="detail">
  <div id="detailContent"></div>
</dialog>

// 写真（JPG）に記録されている撮影日時を読む。アルバムの古い写真でも撮った日が分かる
async function readShotDate(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let p = 2;
    while (p + 10 < v.byteLength) {
      const marker = v.getUint16(p);
      if ((marker & 0xFF00) !== 0xFF00) return null;
      // APP1 の "Exif" ブロックに撮影日時が入っている
      if (marker === 0xFFE1 && v.getUint32(p + 4) === 0x45786966) return parseExifDate(v, p + 10);
      p += 2 + v.getUint16(p + 2);
    }
  } catch {}
  return null;
}
function parseExifDate(v, tiff) {
  const le = v.getUint16(tiff) === 0x4949;
  const u16 = (o) => v.getUint16(tiff + o, le);
  const u32 = (o) => v.getUint32(tiff + o, le);
  const findTag = (ifd, tag) => {
    for (let i = 0; i < u16(ifd); i++) if (u16(ifd + 2 + i * 12) === tag) return ifd + 2 + i * 12;
    return null;
  };
  const ifd0 = u32(4);
  const exifIfd = findTag(ifd0, 0x8769);
  // 0x9003 = 撮影日時、0x0132 = 更新日時（撮影日時がないときの代わり）
  const entry = (exifIfd && findTag(u32(exifIfd + 8), 0x9003)) || findTag(ifd0, 0x0132);
  if (!entry) return null;
  let s = '';
  for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(tiff + u32(entry + 8) + i));
  const m = s.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(img.src); resolve(img); };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function resized(img, maxSize, quality) {
  const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

async function onPhotoSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  let img;
  try {
    img = await loadImage(file);

    return;
  }
  photos = {

    large: resized(img, 800, 0.7),
    thumb: resized(img, 240, 0.7),
  };
  // 撮影日時が読めなければ、ファイルの日時（撮ったその場ならほぼ撮影日時）を使う。季節のヒントとしてAIに渡す
  photoDate = await readShotDate(file);

${allSpecies().map((s) => s.name).join('、')}

${GROUPS.map((g) => g.group).join('、')}

次のJSON形式だけで答えてください。
{
  "candidates": [
    {
      "name": "和名",
      "scientificName": "学名",
      "group": "なかま",
      "confidence": 0から100の整数（この候補である確からしさ）,
      "description": "図鑑の説明文（特徴・見られる場所や季節など、100〜150字）"
    }
  ]
}
植物や虫や犬が写っていない場合は {"candidates": []} を返してください。`;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Google 側が混んでいるとき（500/503）は、待ってやり直し → 軽いモデルに切り替える
// 無料枠の回数切れ（429）のときも軽いモデルへ。回数はモデルごとに別で、軽いモデルのほうがずっと多い
async function identify(dataUrl, month, onStatus = () => {}) {
  if (!geminiKey) throw new Error('先に「⚙ 設定」で API キーを保存してください。');
  const mainModel = getLocal('model', DEFAULT_MODEL);
  const models = [mainModel, FALLBACK_MODEL].filter((m, i, arr) => arr.indexOf(m) === i);
  const [meta, base64] = dataUrl.split(',');
  const mimeType = meta.match(/data:(.*);base64/)[1];

  let lastMsg = '';
  let quotaHit = false;
  for (const model of models) {
    quotaHit = false;
    for (let attempt = 1; attempt <= 3; attempt++) {
      if (model !== mainModel) onStatus(lastMsg.startsWith('429') ? '今日のふつうの回数を使い切ったので、軽いモデルで調べています…' : '混んでいるので軽いモデルで調べています…');
      else if (attempt > 1) onStatus(`混んでいるのでやり直しています…（${attempt}回目）`);

      let res, json;
      try {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiKey },
          body: JSON.stringify({
            contents: [{ parts: [{ inline_data: { mime_type: mimeType, data: base64 } }, { text: buildPrompt(month) }] }],
            generationConfig: { responseMimeType: 'application/json' },
          }),
          signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
        });
        json = await res.json();
      } catch (err) {
        // 返事が来ないときは、同じモデルで待ち直さず次のモデルへ進む
        // （iPhone の Safari は待ち時間切れを TimeoutError ではなく AbortError で知らせることがある）
        if (err.name !== 'TimeoutError' && err.name !== 'AbortError') {
          throw new Error('通信がうまくいきませんでした。電波のよいところで、もう一度試してください。\n' + err.message);
        }
        lastMsg = `${REQUEST_TIMEOUT_MS / 1000}秒待っても返事がありませんでした。`;
        break;
      }
      if (res.ok) {
        const text = json.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        return JSON.parse(text).candidates || [];
      }
      lastMsg = `${res.status} ${json.error?.message || res.statusText}`;
      if (res.status === 429) { quotaHit = true; break; }
      if (res.status !== 500 && res.status !== 503) throw new Error(`画像認識でエラーが起きました\n${lastMsg}`);
      if (attempt < 3) await sleep(attempt * 2000);
    }
  }
  if (quotaHit) {
    throw new Error('今日の無料の回数を使い切りました。毎日夕方4〜5時ごろ（アメリカの夜0時）に回数が元に戻ります。\n' + lastMsg);
  }
  throw new Error('Google 側がとても混み合っています。数分おいてからもう一度試してください。\n' + lastMsg);
}

function recordsOf(name) {
  return entries.filter((e) => e.name === name).sort((a, b) => b.date.localeCompare(a.date));

function speciesCard(s) {
  const recs = recordsOf(s.name);
  if (recs.length === 0) {
    return `<div class="card unfound" data-no="${s.no}">
      <div class="shadow">？</div>
      <div class="body"><div class="num">No.${pad(s.no)}</div><div class="title">？？？</div></div>
    </div>`;
  }
  return `<div class="card" data-no="${s.no}">
    <img src="${recs[0].thumb}" alt="">
    <div class="body"><div class="num">No.${pad(s.no)}</div><div class="title">${escapeHtml(s.name)}</div></div>
  </div>`;
}

function renderZukan() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.kind === currentKind));
  const list = allSpecies().filter((s) => s.kind === currentKind);
  const found = list.filter((s) => recordsOf(s.name).length > 0).length;
  $('progressBar').style.width = `${list.length ? (found / list.length) * 100 : 0}%`;
  $('progressText').textContent = `${currentKind} ${found} / ${list.length} 種 発見`;

  $('zukan').innerHTML = GROUPS.filter((g) => g.kind === currentKind).map(({ group }) => {
    const members = list.filter((s) => s.group === group);
    const groupFound = members.filter((s) => recordsOf(s.name).length > 0).length;
    return `<h3>${escapeHtml(group)} <span class="muted">${groupFound} / ${members.length}</span></h3>
      <div class="grid">${members.map(speciesCard).join('')}</div>`;
  }).join('');
  $('zukan').querySelectorAll('.card').forEach((el) => {
    el.onclick = () => openSpecies(Number(el.dataset.no));
  });
}

function renderNew() {
  const names = [...new Set(entries.filter((e) => !findSpecies(e.name)).map((e) => e.name))];
  $('newCount').textContent = names.length ? `（${names.length}種）` : '';
  $('newList').innerHTML = names.length === 0
    ? '<p class="muted">まだありません。</p>'
    : names.map((name) => `<div class="card new" data-name="${escapeHtml(name)}">
        <img src="${recordsOf(name)[0].thumb}" alt="">
        <div class="body"><div class="num">✨ 新発見</div><div class="title">${escapeHtml(name)}</div></div>
      </div>`).join('');
  $('newList').querySelectorAll('.card').forEach((el) => {
    el.onclick = () => openNew(el.dataset.name);
  });
}

const largePhotos = new Map();

// 大きい写真は詳細を開いたときだけ読む（一覧は小さい写真で軽くする）
async function loadLargePhoto(entry) {
  if (!largePhotos.has(entry.id)) {
    const snap = await getDoc(doc(db, 'photos', entry.id));
    largePhotos.set(entry.id, snap.data()?.photo || entry.thumb);
  }
  const hero = $('detailContent').querySelector('.hero');
  if (hero && hero.dataset.id === entry.id) hero.src = largePhotos.get(entry.id);
}

function heroHtml(entry) {
  return `<img class="hero" data-id="${entry.id}" src="${largePhotos.get(entry.id) || entry.thumb}" alt="">`;
}

function recordsHtml(recs) {
  return `<h3>見つけた記録 <span class="muted">${recs.length}回</span></h3>
    <div class="records">${recs.map((r) => `
      <div class="record">
        <img src="${r.thumb}" alt="">
        <div class="info">
          ${r.nickname ? `<b>おなまえ: ${escapeHtml(r.nickname)}</b><br>` : ''}
          ${new Date(r.date).toLocaleDateString('ja-JP')}<br>
          ${r.finder ? `見つけた人: ${escapeHtml(r.finder)}` : ''}
        </div>
        <button class="small danger" data-delete="${r.id}">削除</button>
      </div>`).join('')}
    </div>`;
}

// 確認ウィンドウ（confirm）は出ないブラウザがあるので、ボタンを2回押して確定する
function confirmByTwoTaps(btn, confirmLabel, action) {
  const originalLabel = btn.textContent;
  let timer = null;
  btn.onclick = async () => {
    if (!timer) {
      btn.textContent = confirmLabel;
      timer = setTimeout(() => { btn.textContent = originalLabel; timer = null; }, 4000);
      return;
    }
    clearTimeout(timer);
    btn.disabled = true;
    await action();
  };
}

function showDetail(html, reopen) {
  reopenDetail = reopen;
  $('detailContent').innerHTML = html + `<div class="body" style="padding-top:0"><div class="row"><button id="closeDetail">閉じる</button></div></div>`;
  $('closeDetail').onclick = () => $('detail').close();
  $('detailContent').querySelectorAll('[data-delete]').forEach((btn) => {
    confirmByTwoTaps(btn, '本当に削除？', async () => {
      const batch = writeBatch(db);
      batch.delete(doc(db, 'entries', btn.dataset.delete));
      batch.delete(doc(db, 'photos', btn.dataset.delete));
      await batch.commit();
    });
  });
  if (!$('detail').open) $('detail').showModal();
}

function openSpecies(no) {
  const s = allSpecies().find((x) => x.no === no);
  if (!s) { $('detail').close(); return; }
  const recs = recordsOf(s.name);
  if (recs.length === 0) {
    showDetail(`<div class="body">
      <div class="num muted">No.${pad(s.no)}・${escapeHtml(s.group)}</div>
      <div class="name">？？？</div>
      <p>まだ見つけていません。</p>
      ${s.note ? `<p class="muted">ヒント: ${escapeHtml(s.note)}</p>` : ''}
    </div>`, () => openSpecies(no));
    return;
  }
  const latest = recs[0];
  showDetail(`${heroHtml(latest)}
    <div class="body">
      <div class="muted">No.${pad(s.no)}・${escapeHtml(s.group)}</div>
      <div class="name">${escapeHtml(s.name)}</div>
      <div class="sci">${escapeHtml(latest.scientificName)}</div>
      ${s.note ? `<p><b>${escapeHtml(s.note)}</b></p>` : ''}
      <p>${escapeHtml(latest.description)}</p>
      ${searchLink(s.name)}
      ${recordsHtml(recs)}
    </div>`, () => openSpecies(no));
  loadLargePhoto(latest);
}

function openNew(name) {
  const recs = recordsOf(name);
  // 図鑑に追加された・登録しなおされたときは、新発見の詳細を閉じる
  if (recs.length === 0 || findSpecies(name)) { $('detail').close(); return; }
  const latest = recs[0];
  const groupOptions = GROUPS.map(({ kind, group }) =>
    `<option value="${escapeHtml(group)}" ${group === latest.group ? 'selected' : ''}>${kind}：${escapeHtml(group)}</option>`).join('');
  const speciesOptions = allSpecies().map((s) =>
    `<option value="${escapeHtml(s.name)}">No.${pad(s.no)} ${escapeHtml(s.name)}</option>`).join('');

  showDetail(`${heroHtml(latest)}
    <div class="body">
      <span class="badge new">✨ 新発見</span>
      <div class="name">${escapeHtml(name)}</div>
      <div class="sci">${escapeHtml(latest.scientificName)}</div>
      <p>${escapeHtml(latest.description)}</p>
      ${searchLink(name)}
      <div class="maint">
        <b>図鑑に追加する</b>
        <label for="addGroup">なかま</label>
        <select id="addGroup">${groupOptions}</select>
        <div class="row"><button class="primary" id="addToZukan">このなかまで図鑑に追加</button></div>
        <label for="mergeTo">または、実は図鑑にいる生き物だった場合</label>
        <select id="mergeTo">${speciesOptions}</select>
        <div class="row"><button id="mergeBtn">この生き物として登録しなおす</button></div>
      </div>
      ${recordsHtml(recs)}
    </div>`, () => openNew(name));
  loadLargePhoto(latest);

  $('addToZukan').onclick = async () => {
    const group = $('addGroup').value;
    await setDoc(doc(collection(db, 'customSpecies')), {
      kind: kindOfGroup(group), group, name, note: '', createdAt: new Date().toISOString(),
    });
    const s = findSpecies(name);
    if (s) { currentKind = s.kind; renderZukan(); openSpecies(s.no); }
  };
  confirmByTwoTaps($('mergeBtn'), 'もう一度押すと登録しなおします', async () => {
    const target = $('mergeTo').value;
    const batch = writeBatch(db);
    recs.forEach((r) => batch.update(doc(db, 'entries', r.id), { name: target }));
    await batch.commit();
    const s = findSpecies(target);
    if (s) { currentKind = s.kind; renderZukan(); openSpecies(s.no); }
  });
}
</script>
